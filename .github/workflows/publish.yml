name: Publish NuGet

# 触发：推送形如 v1.2.3 的 tag 时，构建 → 单测 → 打包 → 推送 NuGet.org → 创建 GitHub Release。
# 版本号取自 tag（去掉前缀 v），覆盖 csproj 里的 <Version>，故发版无需改代码。
#
# 认证：NuGet Trusted Publishing（OIDC），无需 API Key。首次使用需在 nuget.org 配置信任策略：
#   登录 nuget.org → 右上角用户名 → 受信任的发布（Trusted Publishing）→ 新建策略
#   Policy Owner    : Wesden
#   Repository Owner: damahas
#   Repository      : wes-invoice-ocr
#   Workflow File   : publish.yml      （只填文件名，不含 .github/workflows/ 路径）
#   Environment     : 留空              （本工作流不使用 GitHub Actions environment）
# 策略创建后处于“待完全激活”状态，7 天内完成首次发布即永久生效。
# 若账户无“受信任的发布”选项（灰度中），可回退 API Key：删掉登录步骤，
# 把 --api-key 换成 ${{ secrets.NUGET_API_KEY }}，并在仓库 Settings→Secrets 中配置。

on:
  push:
    # tags 过滤是 glob 模式而非正则，无法表达 v[0-9]+.[0-9]+.[0-9]+；
    # 故此处宽匹配 v*，再由 "校验 tag 格式" 步骤做严格校验并给出明确报错。
    tags:
      - 'v*'

# contents: write —— 创建 GitHub Release；GITHUB_TOKEN 由 Actions 自动注入
# id-token: write —— 申请 GitHub OIDC 令牌，供 NuGet Trusted Publishing 换取临时密钥（无此权限登录步骤必失败）
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ONNX 模型经 Git LFS 管理（.gitattributes），需在检出时拉取 LFS 对象，
      # 否则工作区里的 models/*.onnx 只是 130 字节的指针，打包/测试会失败。
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      # 格式非法时尽早失败，避免把错误版本号推到 NuGet（NuGet 同版本不可覆盖）
      - name: 校验 tag 格式
        run: |
          # 正则存变量再引用：避免 =~ 右侧直接写正则时的引号 / 转义歧义
          RE='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if ! [[ "$GITHUB_REF_NAME" =~ $RE ]]; then
            echo "::error::tag 格式非法：$GITHUB_REF_NAME，应为 v1.2.3 或 v1.2.3-beta.1"
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "tag=$GITHUB_REF_NAME -> 包版本 $VERSION"

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          # 测试项目目标框架 net10.0，且 .slnx 解决方案格式需 9.0.200+ SDK
          dotnet-version: 10.0.x

      - name: 还原依赖
        run: dotnet restore Wes.Invoice.slnx

      - name: 构建（Release）
        run: dotnet build Wes.Invoice.slnx -c Release --no-restore

      # 16 个解析器/类型判定/二维码校验单测，零依赖
      - name: 单元测试
        run: dotnet run --project Wes.Invoice.Test -c Release --no-build

      # 不复用上面的构建产物：pack 需按目标版本重新编译，
      # 否则 nupkg 内 DLL 的 AssemblyVersion 会与包版本不一致。
      - name: 打包
        run: dotnet pack Wes.Invoice.Ocr -c Release -o artifacts -p:Version=$VERSION

      # NuGet Trusted Publishing：用 GitHub OIDC 令牌换取临时 API 密钥（有效期 1 小时），
      # 无需在仓库中保存任何长期凭证。需在 nuget.org 配置对应的信任策略（见本文件头注释）。
      # user 填 NuGet 用户名（profile name，非邮箱）；这是公开信息，故直接写死而非存 secret。
      - name: NuGet 登录（OIDC → 临时密钥）
        uses: NuGet/login@v1
        id: login
        with:
          user: Wesden

      # 临时密钥仅 1 小时有效，故登录步骤须紧邻推送
      - name: 推送到 NuGet.org
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --skip-duplicate

      # 幂等：重跑工作流时 Release 可能已存在（手动创建过或上次跑到一半），
      # gh release create 遇到同名会直接失败退出，故先探测再决定创建还是补传。
      # --clobber：同名附件覆盖而非报错。
      - name: 创建 / 更新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，补传附件"
            gh release upload "$GITHUB_REF_NAME" artifacts/*.nupkg --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --generate-notes
          fi
